name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The compiler is the only dependency, and it has none of its own.
      - name: Install
        run: pip install .

      - name: Verify the specs
        run: python -m tapscript spec --tag mcp || python -m tapscript spec

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Speak the protocol
        shell: bash
        run: |
          # Through a file rather than a pipe. `| grep -q` closes the pipe on
          # its first match, and this shell runs with pipefail, so the server
          # stopping on a broken pipe reddened the build -- a race decided by
          # how fast the interpreter got through the second reply.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            > handshake.jsonl
          python -m tapscript_mcp < handshake.jsonl > answers.jsonl
          grep -q '"protocolVersion"' answers.jsonl
          grep -q '"tools"' answers.jsonl
          test "$(wc -l < answers.jsonl)" -eq 2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check tapscript_mcp tests
