name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the only thing that says which version this is, and nothing
      # else in the repository knows about it. Without this a `v1.0.1` tag on a
      # tree still saying 1.0.0 publishes 1.0.0 -- under a release page claiming
      # otherwise, and unfixably, because PyPI will not accept that filename
      # twice. The sibling repository learned this by doing it.
      #
      # The version lives only in pyproject.toml here: there is no version.py
      # and no __version__, so this reads the file rather than importing the
      # package, which also means the check runs before anything is installed.
      - name: The tag must match the version in the tree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c '
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          ')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, pyproject.toml says $version" >&2
            exit 1
          fi
          echo "releasing $version"

      # PyPI rejects any distribution whose metadata carries a direct reference
      # -- a `name @ git+https://...` dependency -- and rejects it at upload,
      # after the tag exists and the build has passed. This repository has held
      # such a pin before, so the check runs here rather than being remembered:
      # it fails in the first job, before a tag has been turned into anything.
      - name: No dependency may be a direct reference
        run: |
          python - <<'PY'
          import pathlib, sys, tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project = data["project"]
          groups = {"dependencies": project.get("dependencies", [])}
          for name, entries in project.get("optional-dependencies", {}).items():
              groups[f"optional-dependencies.{name}"] = entries

          offenders = [
              f"{group}: {entry}"
              for group, entries in groups.items()
              for entry in entries
              if "@" in entry.split(";")[0]
          ]
          if offenders:
              print("PyPI will refuse these; pin a released version instead:", file=sys.stderr)
              for line in offenders:
                  print(f"  {line}", file=sys.stderr)
              sys.exit(1)
          print("all dependencies are version specifiers")
          PY

      - name: Install
        run: pip install .

      - name: Verify the specs
        run: python -m plainsong spec --tag mcp || python -m plainsong spec

      - name: Run the tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      # twine check reads the metadata the way PyPI will, so a description that
      # will not render, or a classifier PyPI does not recognise, fails here
      # rather than at upload.
      - name: Check the metadata the way PyPI will
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # This needs a Trusted Publisher configured on PyPI for this project --
      # Publishing -> Add a new pending publisher, owner SuperInstance, repo
      # plainsong-mcp, workflow release.yml, environment left EMPTY. Without it
      # the upload fails with `invalid-publisher: valid token, but no
      # corresponding publisher`, which is exactly how the sibling repository
      # accumulated five tags and zero releases before anyone read the log.
      #
      # skip-existing makes a re-run idempotent: a release whose files reached
      # PyPI some other way can still complete the release job below, instead of
      # aborting on "file already exists" and leaving a tag with no release.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release cannot create a release without it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
