name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This package is nothing without the compiler, and the floor in
      # pyproject.toml is a real requirement rather than caution: below it the
      # install succeeds and the import fails. Installing the package itself is
      # what proves the floor is honest.
      - name: Install
        run: pip install .

      # The tag is the only thing that says which version this is, and nothing
      # in the tree knows about it. A `v1.1.0` tag on a tree still saying 1.0.0
      # publishes 1.0.0 under a release page claiming otherwise -- unfixably,
      # because PyPI will not accept that filename twice.
      - name: The tag must match the version in the tree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import importlib.metadata as m; print(m.version("plainsong-mcp"))')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, the package says $version" >&2
            exit 1
          fi
          echo "releasing $version"

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Verify the specs
        run: python -m plainsong spec --tag mcp

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted Publishing. There is no API token in this repository and there
      # should never be one. The publisher is configured on PyPI, not here, and
      # a missing one fails at this step *after* a successful build -- which in
      # the compiler's repository went unread through six releases. If this step
      # reports `invalid-publisher`, read the claims it prints: `repository`,
      # `workflow_ref` and `environment` are exactly what the publisher has to
      # match, and `environment: MISSING` means leave that field empty.
      #
      # skip-existing makes a re-run idempotent. Without it a version whose
      # files reached PyPI some other way can never be re-run, because the
      # upload aborts on "file already exists" and `release` below never runs.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release cannot create a release without it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
