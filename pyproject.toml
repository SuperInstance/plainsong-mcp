[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tapscript-mcp"
version = "1.0.0"
description = "A Model Context Protocol server for TapScript: many agents, one score."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "model context protocol", "music", "notation", "agents", "midi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# The compiler this serves. Nothing else -- the protocol, both transports and
# the session store are written against the standard library, exactly as
# tapscript itself is.
#
# Tracking master rather than a release, because tapscript is not on PyPI yet.
# Swap this for a version specifier (`tapscript>=1.0`) the day it publishes --
# it is the only line that has to change.
dependencies = [
    "tapscript @ git+https://github.com/SuperInstance/tapscript-studio@master",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tapscript-mcp = "tapscript_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/tapscript-mcp"
Compiler = "https://github.com/SuperInstance/tapscript-studio"

[tool.setuptools.packages.find]
include = ["tapscript_mcp*"]

[tool.ruff]
line-length = 108
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]
