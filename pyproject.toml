[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plainsong-mcp"
version = "1.0.0"
description = "A Model Context Protocol server for Plainsong: many agents, one score."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "model context protocol", "music", "notation", "agents", "midi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# The compiler this serves. Nothing else -- the protocol, both transports and
# the session store are written against the standard library, exactly as
# plainsong itself is.
#
# 1.1.0 is the first release that publishes `plainsong.features`, which this
# package re-exports rather than duplicating. Below that it would install and
# then fail on import, so the floor is a real requirement and not caution.
dependencies = [
    "plainsong>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
plainsong-mcp = "plainsong_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/plainsong-mcp"
Compiler = "https://github.com/SuperInstance/plainsong"

[tool.setuptools.packages.find]
include = ["plainsong_mcp*"]

[tool.ruff]
line-length = 108
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]
